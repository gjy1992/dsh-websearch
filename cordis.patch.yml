# Bundle patch layer:
# 1. insert the plugin row (registers the unified search provider)
# 2. wire the built-in web_search tool to the unified provider.
# 注意：这里不要写 config —— 行配置由 UI 的 plugins.row.config 账本管理；
# 组合层一旦显式写 config/disabled，就会盖住 UI 保存的值（提示"被更高优先级覆盖"）。
- insert:
    - id: dsh-websearch
      name: '@240xu/dsh-websearch'
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: unified
